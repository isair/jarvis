name: Release Smoke Test

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and test installers without publishing a release
        type: boolean
        required: true
        default: true

concurrency:
  group: release-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Generate a dev version string from the commit SHA
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}

    steps:
      - id: compute
        run: echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  # Build + smoke-test all platforms using the reusable workflow
  build-desktop:
    needs: [generate-version]
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.generate-version.outputs.version }}
      channel: develop
      smoke_test: true

  # ── Gate: fast-forward main → develop ──────────────────────────────────
  release:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: success()
    timeout-minutes: 5

    permissions:
      contents: write
      actions: write  # needed to dispatch release.yml (workflow_dispatch)

    steps:
      - name: 📥 Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: develop

      - name: 🔀 Fast-forward main to develop
        id: promote
        run: |
          set -euo pipefail
          echo "promoted=false" >> "$GITHUB_OUTPUT"

          if [ "$JARVIS_VALIDATE_ONLY" != "false" ] ||
             [ "$JARVIS_SMOKE_REF" != "refs/heads/develop" ] ||
             [ "$JARVIS_SMOKE_BUILD_RESULT" != "success" ]; then
            echo "🧪 No release promotion for this run."
            exit 0
          fi

          echo "Current state:"
          echo "   develop HEAD (tested): $JARVIS_TESTED_SHA"

          # Promotion requires the freshly fetched develop tip tested by this run.
          git fetch origin main develop

          MAIN_SHA=$(git rev-parse origin/main)
          DEVELOP_SHA=$(git rev-parse origin/develop)
          TESTED_SHA="$JARVIS_TESTED_SHA"

          if [ "$TESTED_SHA" != "$DEVELOP_SHA" ]; then
            echo "❌ The tested commit is not the current develop tip."
            echo "   🔁 Run smoke checks again for current develop before publishing."
            exit 1
          fi

          echo "   origin/main:  $MAIN_SHA"
          echo "   tested SHA:   $TESTED_SHA"

          # Verify the tested commit is a descendant of main (fast-forward possible)
          if git merge-base --is-ancestor "$MAIN_SHA" "$TESTED_SHA"; then
            echo "main is an ancestor of the tested commit - fast-forward is safe"
          else
            echo "main has diverged - fast-forward is not possible"
            echo "   This means commits were pushed directly to main."
            echo "   Please rebase or merge manually."
            exit 1
          fi

          echo ""
          echo "Fast-forwarding main to $TESTED_SHA..."

          git checkout main
          git merge --ff-only "$TESTED_SHA"

          echo ""
          echo "Pushing main..."
          git push origin main

          NEW_MAIN_SHA=$(git rev-parse main)
          echo ""
          echo "Release complete!"
          echo "   main is now at: $NEW_MAIN_SHA"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JARVIS_VALIDATE_ONLY: ${{ inputs.validate_only }}
          JARVIS_SMOKE_REF: ${{ github.ref }}
          JARVIS_SMOKE_BUILD_RESULT: ${{ needs.build-desktop.result }}
          JARVIS_TESTED_SHA: ${{ github.sha }}

      # GitHub does NOT fire on:push workflows for pushes made with
      # GITHUB_TOKEN, so release.yml would never run after the fast-forward
      # above and the release would silently not be published. Dispatch it
      # explicitly: workflow_dispatch is one of the two event types
      # GITHUB_TOKEN is allowed to trigger. semantic-release inside
      # release.yml decides whether a new version is warranted; if not, the
      # run simply finishes without publishing.
      - name: 🚀 Trigger release workflow
        run: |
          if [ "$JARVIS_RELEASE_PROMOTED" != "true" ]; then
            exit 0
          fi
          gh workflow run release.yml --ref main --repo "$JARVIS_RELEASE_REPOSITORY"
          echo "🚀 Dispatched release.yml on main. See https://github.com/$JARVIS_RELEASE_REPOSITORY/actions/workflows/release.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JARVIS_RELEASE_PROMOTED: ${{ steps.promote.outputs.promoted }}
          JARVIS_RELEASE_REPOSITORY: ${{ github.repository }}
