name: Document native qualification
on:
  push:
    branches: [codex/document-windows-native-20261019]
permissions:
  contents: read
jobs:
  windows-capabilities:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🧪 Verify native directory mutation boundaries
        run: python tests/fixtures/document_windows_probe.py
